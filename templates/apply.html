<!DOCTYPE html>
<html>
<head>
    <title>Application Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>{{ scheme }} Application</h1>

    <form action="/submit_application" method="POST">

        <input type="text" name="full_name" placeholder="Full Name" required>
        <input type="date" name="dob" required>
        <input type="text" name="aadhaar" placeholder="Aadhaar Number" required>
        <input type="text" name="mobile" placeholder="Mobile Number" required>
        <input type="text" name="bank_account" placeholder="Bank Account Number" required>
        <input type="text" name="ifsc" placeholder="IFSC Code" required>

        <input type="hidden" name="scheme" value="{{ scheme }}">

        <button type="submit">Submit Application</button>
    </form>
</div>

</body>
</html>
