<!DOCTYPE html>
<html>
<head>
    <title>Public Welfare Scheme Finder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>Public Welfare Scheme Finder</h1>
    <p>Find government schemes you are eligible for</p>

    <form method="POST">

        <select name="occupation" required>
            <option value="">Select Occupation</option>
            <option>Student</option>
            <option>Farmer</option>
            <option>Unemployed</option>
        </select>

        <select name="category" required>
            <option value="">Social Category</option>
            <option>General</option>
            <option>OBC</option>
            <option>SC</option>
            <option>ST</option>
        </select>

        <select name="gender" required>
            <option value="">Gender</option>
            <option>Male</option>
            <option>Female</option>
        </select>

        <input type="number" name="income" placeholder="Annual Income (₹)" required>

        <button type="submit">Find Eligible Schemes</button>

    </form>
</div>

</body>
</html>
